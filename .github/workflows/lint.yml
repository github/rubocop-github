name: lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # pin@v1.324.0
        with:
          bundler-cache: true

      - name: lint
        run: script/lint
