name: lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # pin@v1.323.0
        with:
          bundler-cache: true

      - name: lint
        run: script/lint
